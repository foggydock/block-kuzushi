<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ブロックくずし</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0d1030; color: #fff;
    font-family: "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "Hiragino Sans", sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #131845; border-radius: 12px; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  .screen {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    background: rgba(8,10,32,.92); text-align: center; padding: 20px;
  }
  .screen.on { display: flex; }
  h1 { font-size: 40px; margin: 0 0 4px; letter-spacing: 2px; }
  h1 .c1{color:#ff6b8a} h1 .c2{color:#ffd166} h1 .c3{color:#6bf0c8} h1 .c4{color:#8ab4ff}
  p.sub { margin: 0; font-size: 18px; color: #c8cdf0; line-height: 1.7; }
  button {
    font: inherit; font-size: 26px; font-weight: bold; color: #12163c;
    background: #ffd166; border: none; border-radius: 999px;
    padding: 16px 44px; margin: 4px; cursor: pointer;
    box-shadow: 0 5px 0 #c9a03c; min-width: 220px;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c9a03c; }
  button.alt { background: #6bf0c8; box-shadow: 0 5px 0 #3aad8c; }
  button.small { font-size: 20px; padding: 12px 28px; min-width: 0; }
  .big { font-size: 30px; font-weight: bold; }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>

<div id="title" class="screen on">
  <h1><span class="c1">ブ</span><span class="c2">ロ</span><span class="c3">ッ</span><span class="c4">ク</span>くずし</h1>
  <p class="sub">ゆびで バーを うごかして<br>ボールを はねかえそう！</p>
  <button id="btnEasy">やさしい</button>
  <button id="btnNormal" class="alt">ふつう</button>
</div>

<div id="over" class="screen">
  <div id="overMsg" class="big"></div>
  <p id="overSub" class="sub"></p>
  <button id="btnAgain">もういちど</button>
  <button id="btnTitle" class="small alt">さいしょから</button>
</div>

<script>
(function () {
  var W = 480, H = 720;
  var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  var scale = 1, rect = null;

  function resize() {
    var pad = 8;
    var aw = window.innerWidth - pad * 2, ah = window.innerHeight - pad * 2;
    scale = Math.min(aw / W, ah / H);
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.style.width = (W * scale) + 'px';
    cv.style.height = (H * scale) + 'px';
    cv.width = Math.round(W * scale * dpr);
    cv.height = Math.round(H * scale * dpr);
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    rect = null;
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function () { setTimeout(resize, 300); });
  resize();

  // ---- ステージ（1=ブロックあり, 数字=かたさ）----
  var STAGES = [
    ["1111111","1111111","1111111","2222222"],
    ["0111110","1111111","1122111","0111110","0011100"],
    ["1010101","1111111","0121210","1111111","1010101"],
    ["2222222","1111111","1111111","1111111","2222222"],
    ["0011100","0122210","1223221","0122210","0011100"]
  ];
  var COLORS = ['#ff6b8a', '#ffd166', '#6bf0c8', '#8ab4ff', '#c58bff'];

  var COLS = 7, BW = 60, BH = 26, BTOP = 90, BLEFT = 30;

  var G = {
    mode: 'easy', running: false, stage: 0, lives: 5, score: 0,
    paddle: { x: W / 2, w: 120, h: 18, y: H - 60 },
    ball: null, bricks: [], items: [], sparks: [], stuck: true, msg: '', msgT: 0
  };

  function makeBricks(si) {
    var rows = STAGES[si % STAGES.length], out = [];
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < COLS; c++) {
        var v = parseInt(rows[r].charAt(c), 10) || 0;
        if (v > 0) out.push({ x: BLEFT + c * BW, y: BTOP + r * (BH + 8), w: BW - 6, h: BH, hp: v, col: COLORS[r % COLORS.length] });
      }
    }
    return out;
  }

  function resetBall() {
    var sp = (G.mode === 'easy') ? 4.6 : 6.0;
    G.ball = { x: G.paddle.x, y: G.paddle.y - 16, r: 10, vx: 0, vy: 0, sp: sp };
    G.stuck = true;
  }

  function launch() {
    if (!G.stuck) return;
    var a = (-Math.PI / 2) + (Math.random() * 0.6 - 0.3);
    G.ball.vx = Math.cos(a) * G.ball.sp;
    G.ball.vy = Math.sin(a) * G.ball.sp;
    G.stuck = false;
  }

  function startGame(mode) {
    G.mode = mode;
    G.paddle.w = (mode === 'easy') ? 130 : 95;
    G.lives = (mode === 'easy') ? 5 : 3;
    G.score = 0; G.stage = 0;
    G.paddle.x = W / 2;
    G.bricks = makeBricks(0); G.items = []; G.sparks = [];
    resetBall();
    say('ステージ 1');
    show(null); G.running = true;
  }

  function nextStage() {
    G.stage++;
    G.paddle.w = (G.mode === 'easy') ? 130 : 95;
    G.bricks = makeBricks(G.stage); G.items = [];
    resetBall();
    say('ステージ ' + (G.stage + 1));
  }

  function say(t) { G.msg = t; G.msgT = 90; }

  function boom(x, y, col) {
    for (var i = 0; i < 8; i++) {
      G.sparks.push({ x: x, y: y, vx: (Math.random() - .5) * 5, vy: (Math.random() - .5) * 5, life: 22, col: col });
    }
  }

  // ---- そうさ ----
  function movePaddle(clientX) {
    if (!rect) rect = cv.getBoundingClientRect();
    var x = (clientX - rect.left) / scale;
    G.paddle.x = Math.max(G.paddle.w / 2, Math.min(W - G.paddle.w / 2, x));
  }
  function onDown(e) { rect = null; onMove(e); launch(); }
  function onMove(e) {
    var t = e.touches ? e.touches[0] : e;
    if (t) movePaddle(t.clientX);
    if (e.cancelable) e.preventDefault();
  }
  cv.addEventListener('touchstart', onDown, { passive: false });
  cv.addEventListener('touchmove', onMove, { passive: false });
  cv.addEventListener('mousedown', onDown);
  cv.addEventListener('mousemove', function (e) { if (G.running) onMove(e); });

  // ---- ループ ----
  function update() {
    if (!G.running) return;
    var b = G.ball, p = G.paddle;

    if (G.stuck) { b.x = p.x; b.y = p.y - 16; }
    else {
      var steps = 2;
      for (var s = 0; s < steps; s++) {
        b.x += b.vx / steps; b.y += b.vy / steps;
        if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
        if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
        if (b.y < b.r + 40) { b.y = b.r + 40; b.vy = Math.abs(b.vy); }

        // パドル
        if (b.vy > 0 && b.y + b.r >= p.y && b.y - b.r <= p.y + p.h &&
            b.x >= p.x - p.w / 2 - b.r && b.x <= p.x + p.w / 2 + b.r) {
          b.y = p.y - b.r;
          var rel = (b.x - p.x) / (p.w / 2);
          rel = Math.max(-1, Math.min(1, rel));
          var ang = (-Math.PI / 2) + rel * (Math.PI / 3);
          b.vx = Math.cos(ang) * b.sp; b.vy = Math.sin(ang) * b.sp;
        }

        // ブロック
        for (var i = 0; i < G.bricks.length; i++) {
          var k = G.bricks[i];
          if (b.x + b.r > k.x && b.x - b.r < k.x + k.w && b.y + b.r > k.y && b.y - b.r < k.y + k.h) {
            var ox = Math.min(b.x + b.r - k.x, k.x + k.w - (b.x - b.r));
            var oy = Math.min(b.y + b.r - k.y, k.y + k.h - (b.y - b.r));
            if (ox < oy) b.vx = -b.vx; else b.vy = -b.vy;
            k.hp--;
            boom(k.x + k.w / 2, k.y + k.h / 2, k.col);
            G.score += 10;
            if (k.hp <= 0) {
              if (Math.random() < 0.12) G.items.push({ x: k.x + k.w / 2, y: k.y, t: (Math.random() < .5 ? 'big' : 'life') });
              G.bricks.splice(i, 1);
            }
            break;
          }
        }
      }
    }

    // アイテム
    for (var j = G.items.length - 1; j >= 0; j--) {
      var it = G.items[j];
      it.y += 2.6;
      if (it.y > p.y - 10 && it.y < p.y + 20 && Math.abs(it.x - p.x) < p.w / 2 + 14) {
        if (it.t === 'big') { p.w = Math.min(200, p.w + 30); say('バーが おおきい！'); }
        else { G.lives++; say('ライフ ＋1'); }
        G.items.splice(j, 1);
      } else if (it.y > H) G.items.splice(j, 1);
    }

    for (var q = G.sparks.length - 1; q >= 0; q--) {
      var sp = G.sparks[q]; sp.x += sp.vx; sp.y += sp.vy; sp.life--;
      if (sp.life <= 0) G.sparks.splice(q, 1);
    }
    if (G.msgT > 0) G.msgT--;

    // おちた
    if (b.y - b.r > H) {
      G.lives--;
      if (G.lives <= 0) { G.running = false; gameOver(false); }
      else { resetBall(); say('あと ' + G.lives + 'こ'); }
    }

    // クリア
    if (G.bricks.length === 0) {
      if (G.stage >= STAGES.length - 1) { G.running = false; gameOver(true); }
      else nextStage();
    }
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = '#131845'; ctx.fillRect(0, 0, W, H);

    // 上のバー
    ctx.fillStyle = '#0d1030'; ctx.fillRect(0, 0, W, 40);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';
    ctx.fillText('てん ' + G.score, 14, 21);
    ctx.textAlign = 'right';
    var hearts = ''; for (var i = 0; i < Math.min(G.lives, 8); i++) hearts += '♥';
    ctx.fillStyle = '#ff6b8a'; ctx.fillText(hearts, W - 14, 21);
    ctx.fillStyle = '#c8cdf0'; ctx.textAlign = 'center';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('ステージ ' + (G.stage + 1), W / 2, 21);

    // ブロック
    for (var i2 = 0; i2 < G.bricks.length; i2++) {
      var k = G.bricks[i2];
      ctx.fillStyle = k.col;
      roundRect(k.x, k.y, k.w, k.h, 6); ctx.fill();
      if (k.hp > 1) {
        ctx.fillStyle = 'rgba(255,255,255,.55)';
        roundRect(k.x + 6, k.y + 6, k.w - 12, k.h - 12, 4); ctx.fill();
      }
    }

    // アイテム
    for (var j = 0; j < G.items.length; j++) {
      var it = G.items[j];
      ctx.fillStyle = it.t === 'big' ? '#6bf0c8' : '#ff6b8a';
      ctx.beginPath(); ctx.arc(it.x, it.y, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#12163c'; ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(it.t === 'big' ? '大' : '♥', it.x, it.y + 1);
    }

    // きらきら
    for (var q = 0; q < G.sparks.length; q++) {
      var sp = G.sparks[q];
      ctx.globalAlpha = sp.life / 22;
      ctx.fillStyle = sp.col;
      ctx.fillRect(sp.x - 2, sp.y - 2, 5, 5);
      ctx.globalAlpha = 1;
    }

    // パドル
    var p = G.paddle;
    ctx.fillStyle = '#ffd166';
    roundRect(p.x - p.w / 2, p.y, p.w, p.h, 9); ctx.fill();

    // ボール
    if (G.ball) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(G.ball.x, G.ball.y, G.ball.r, 0, 7); ctx.fill();
    }

    if (G.stuck && G.running) {
      ctx.fillStyle = '#fff'; ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('がめんを タップで スタート！', W / 2, H - 130);
    }
    if (G.msgT > 0) {
      ctx.globalAlpha = Math.min(1, G.msgT / 25);
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(G.msg, W / 2, H / 2);
      ctx.globalAlpha = 1;
    }
  }

  function loop() { update(); draw(); requestAnimationFrame(loop); }
  loop();

  // ---- がめん きりかえ ----
  var elTitle = document.getElementById('title'), elOver = document.getElementById('over');
  function show(el) {
    elTitle.classList.remove('on'); elOver.classList.remove('on');
    if (el) el.classList.add('on');
  }
  function gameOver(clear) {
    document.getElementById('overMsg').textContent = clear ? 'ぜんぶ クリア！ おめでとう！' : 'ゲームオーバー';
    document.getElementById('overSub').textContent = 'てんすう ' + G.score + 'てん';
    show(elOver);
  }
  document.getElementById('btnEasy').onclick = function () { startGame('easy'); };
  document.getElementById('btnNormal').onclick = function () { startGame('normal'); };
  document.getElementById('btnAgain').onclick = function () { startGame(G.mode); };
  document.getElementById('btnTitle').onclick = function () { show(elTitle); };
})();
</script>
</body>
</html>
